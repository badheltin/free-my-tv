<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div id="stage">
  <div id="rail"></div>
  <div id="main">
    <div id="hole"></div>
    <div id="hero" class="part">
      <div class="photo"></div>
      <div class="shade"></div>
      <div class="clock"></div>
      <div class="city"></div>
      <div class="temp"></div>
      <div class="cond"></div>
      <div class="hours"></div>
      <div class="days"></div>
      <div class="credit">Foto: Sérgio Mourão, CC BY 3.0</div>
      <div class="tips"><div class="title"></div><div class="strip"></div></div>
    </div>
    <div id="apps" class="part"><div class="strip"></div></div>
    <div id="live" class="part"><div class="title">Assistidos recentemente</div><div class="strip"></div></div>
  </div>
  <div id="all"><h2>Apps</h2><div class="grid"></div></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="hub.js"></script>
</body>
</html>
